<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 이동</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 50% 35%, rgba(85, 223, 218, 0.18), transparent 22rem),
        linear-gradient(135deg, #09142d 0%, #142b5a 58%, #194576 100%);
    }

    .status-box {
      width: min(520px, 100%);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.20);
      backdrop-filter: blur(14px);
    }

    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 18px;
      border: 5px solid rgba(255, 255, 255, 0.18);
      border-top-color: #55dfda;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.55rem;
    }

    p {
      margin: 0;
      color: #dce6f8;
      line-height: 1.7;
    }

    .manual-link {
      display: none;
      margin-top: 22px;
      min-height: 48px;
      padding: 12px 20px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      color: #0d2147;
      background: #55dfda;
      font-weight: 900;
      text-decoration: none;
    }

    .error {
      color: #ffd6d6;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="status-box">
    <div class="spinner" aria-hidden="true"></div>
    <h1 id="title">새 웹사이트로 이동 중입니다.</h1>
    <p id="message">잠시만 기다려 주세요.</p>

    <a
      id="manualLink"
      class="manual-link"
      href="#"
      rel="noopener noreferrer"
    >
      새 웹사이트로 이동
    </a>
  </main>

  <script>
    /*
     * ==========================================================
     * 아래 한 줄에 이동할 새로운 웹사이트 주소만 입력하세요.
     * 예:
     * const TARGET_URL = 'https://example.com/';
     * ==========================================================
     */
    const TARGET_URL = 'https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec';

    (function redirectToNewSite() {
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const manualLink = document.getElementById('manualLink');

      const url = String(TARGET_URL || '').trim();

      // 링크를 아직 입력하지 않은 경우 잘못된 주소로 이동하지 않습니다.
      if (
        !url ||
        url === 'https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec' ||
        !/^https?:\/\//i.test(url)
      ) {
        title.textContent = '이동할 링크가 설정되지 않았습니다.';
        message.textContent =
          'index.html의 TARGET_URL에 https:// 또는 http://로 시작하는 새로운 주소를 입력해 주세요.';
        message.classList.add('error');
        return;
      }

      // 수동 이동 버튼도 같은 주소를 사용합니다.
      manualLink.href = url;
      manualLink.style.display = 'inline-flex';

      // 현재 페이지를 방문 기록에 남기지 않고 즉시 이동합니다.
      window.location.replace(url);
    })();
  </script>
</body>
</html>
