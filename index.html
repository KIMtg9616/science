<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지 이동</title>
</head>
<body>
  <script>
    /*
      ==========================================================
      아래 따옴표 안에 이동할 주소를 그대로 붙여 넣으세요.

      예)
      const TARGET_URL = "https://example.com/";

      주의:
      - 반드시 https:// 또는 http://부터 입력
      - 따옴표 " " 는 지우지 않음
      - 이 줄 이외에는 수정하지 않아도 됨
      ==========================================================
    */
    const TARGET_URL = "https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec";

    // 별도 검사 없이 입력한 주소로 바로 이동합니다.
    window.location.href = TARGET_URL;
  </script>

  <noscript>
    JavaScript를 사용할 수 있어야 새 웹사이트로 이동할 수 있습니다.
  </noscript>
</body>
</html>
