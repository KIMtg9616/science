<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>희망의 과학싹잔치 과학 아카이브</title>

  <!-- 검색엔진에는 이전 페이지를 별도로 노출하지 않도록 설정 -->
  <meta name="robots" content="noindex, nofollow">

  <!-- JavaScript가 꺼져 있어도 즉시 이동 -->
  <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec">

  <link rel="canonical" href="https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        "Pretendard",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;
      background: #0f1f45;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    .redirect-box {
      width: min(520px, calc(100% - 40px));
      padding: 36px;
      box-sizing: border-box;
      text-align: center;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      background: rgba(255,255,255,.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.7rem;
    }

    p {
      margin: 0 0 20px;
      color: #dce6f8;
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 14px;
      color: #0f1f45;
      background: #55dfda;
      font-weight: 900;
      text-decoration: none;
    }
  </style>

  <script>
    /*
     * 이동할 웹사이트 주소입니다.
     * 추후 주소가 바뀌면 아래 한 줄만 수정하면 됩니다.
     */
    const TARGET_URL = 'https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec';

    // 현재 페이지를 브라우저 방문 기록에 남기지 않고 즉시 이동합니다.
    window.location.replace(TARGET_URL);
  </script>
</head>

<body>
  <main class="redirect-box">
    <h1>새 웹사이트로 이동 중입니다.</h1>
    <p>
      자동으로 이동하지 않는 경우 아래 버튼을 눌러 주세요.
    </p>
    <a href="https://script.google.com/macros/s/AKfycby5TWpEZqNCTYRkCx_EfMWCblMXPTsO-mj5gRSdgo3NwKYfSUk1EpWLtNKqk94tlBA8KA/exec">
      새 웹사이트로 이동
    </a>
  </main>
</body>
</html>
